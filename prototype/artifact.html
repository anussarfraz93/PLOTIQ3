<meta charset="UTF-8">
<title>PLOTIQ</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* ---------- Design tokens ---------- */
  :root{
    --canvas:#eef1f6; --surface:#ffffff; --surface-2:#e3e8f0; --surface-hover:#d9e0ec;
    --ink:#10162a; --ink-muted:#5b6480; --ink-faint:#8890a8;
    --line:#d3d9e6; --line-strong:#b9c1d4;
    --accent:#c1662a; --accent-strong:#a5541f; --accent-soft:#f3e0cf; --accent-ink:#fffaf5;
    --good:#1f8f5f; --good-bg:#e3f5ec;
    --shadow:0 18px 40px -18px rgba(16,22,42,.28);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --canvas:#0a0f1c; --surface:#121a2b; --surface-2:#1a2438; --surface-hover:#22304c;
      --ink:#edf1fa; --ink-muted:#97a2c1; --ink-faint:#69739a;
      --line:#243050; --line-strong:#334268;
      --accent:#e2913f; --accent-strong:#f2a352; --accent-soft:#3a2a17; --accent-ink:#1a1206;
      --good:#3fd190; --good-bg:rgba(63,209,144,.14);
      --shadow:0 18px 40px -16px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --canvas:#0a0f1c; --surface:#121a2b; --surface-2:#1a2438; --surface-hover:#22304c;
    --ink:#edf1fa; --ink-muted:#97a2c1; --ink-faint:#69739a;
    --line:#243050; --line-strong:#334268;
    --accent:#e2913f; --accent-strong:#f2a352; --accent-soft:#3a2a17; --accent-ink:#1a1206;
    --good:#3fd190; --good-bg:rgba(63,209,144,.14);
    --shadow:0 18px 40px -16px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;}
  body{margin:0;font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;background:var(--canvas);
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;color:var(--ink);}
  h1,h2,h3{font-family:'Fraunces',Georgia,serif;text-wrap:balance;margin:0;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;}
  button{font-family:inherit;}
  *:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* ---------- Device frame ---------- */
  .phone{width:400px;max-width:100%;height:840px;background:#000;border-radius:40px;padding:8px;
    box-shadow:var(--shadow);position:relative;}
  .screen{width:100%;height:100%;background:var(--canvas);border-radius:32px;overflow:hidden;
    display:flex;flex-direction:column;position:relative;}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:22px;
    background:#000;border-radius:0 0 14px 14px;z-index:30;}

  /* ---------- App shell ---------- */
  .app-shell{display:flex;flex-direction:column;height:100%;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:16px 14px 12px 16px;background:var(--surface);border-bottom:1px solid var(--line);
    flex-shrink:0;padding-top:26px;}
  .brand{display:flex;align-items:center;gap:9px;}
  .brand .mark{width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--canvas);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .brand .mark svg{width:17px;height:17px;}
  .brand-text h1{font-size:19px;font-weight:600;letter-spacing:.2px;line-height:1;color:var(--ink);}
  .brand-text p{margin:3px 0 0;font-size:10.5px;color:var(--ink-muted);letter-spacing:.3px;}
  .icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);
    color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
    transition:background .15s,border-color .15s;}
  .icon-btn:hover{background:var(--surface-hover);border-color:var(--line-strong);}
  .icon-btn svg{width:18px;height:18px;}

  .body-row{flex:1;display:flex;min-height:0;}

  /* ---------- Left icon rail ---------- */
  .rail{width:58px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0;}
  .rail-btn{position:relative;width:42px;height:42px;border-radius:12px;border:none;background:transparent;
    color:var(--ink-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:background .15s,color .15s;}
  .rail-btn svg{width:20px;height:20px;}
  .rail-btn:hover{background:var(--surface-2);color:var(--ink);}
  .rail-btn.active{background:var(--ink);color:var(--canvas);}
  .rail-btn .badge{position:absolute;top:-2px;right:-2px;min-width:16px;height:16px;padding:0 4px;
    border-radius:8px;background:var(--accent);color:var(--accent-ink);font-size:9.5px;font-weight:700;
    display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;}
  .rail-label{font-size:8.5px;color:var(--ink-faint);margin-top:-3px;letter-spacing:.2px;}

  /* ---------- Main / views ---------- */
  .main{flex:1;min-width:0;overflow-y:auto;position:relative;}
  .view{display:none;flex-direction:column;height:100%;}
  .view.visible{display:flex;}

  /* Chat view */
  .chat{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px;}
  .bubble{max-width:84%;padding:11px 14px;border-radius:16px;font-size:13.5px;line-height:1.45;
    animation:pop .22s ease;}
  @keyframes pop{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);color:var(--ink);
    border-bottom-left-radius:4px;}
  .user{align-self:flex-end;background:var(--ink);color:var(--canvas);border-bottom-right-radius:4px;font-weight:600;}

  .opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-self:stretch;}
  .opt-card{display:flex;flex-direction:column;align-items:flex-start;gap:8px;background:var(--surface);
    border:1px solid var(--line);border-radius:14px;padding:11px 12px;cursor:pointer;text-align:left;
    transition:border-color .15s,transform .1s,background .15s;}
  .opt-card:hover{border-color:var(--accent);background:var(--surface-hover);}
  .opt-card:active{transform:scale(.98);}
  .opt-card .oi{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent-strong);
    display:flex;align-items:center;justify-content:center;}
  .opt-card .oi svg{width:16px;height:16px;}
  .opt-card .ol{font-size:12.5px;font-weight:600;line-height:1.25;color:var(--ink);}
  .opt-card .osub{font-size:10.5px;color:var(--ink-muted);}

  .free-row{display:flex;gap:8px;align-self:stretch;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;
    align-self:stretch;margin-top:2px;position:relative;}
  .card h3{margin:0 0 2px;font-size:16px;color:var(--ink);}
  .card .meta{font-size:11.5px;color:var(--ink-muted);margin-bottom:8px;}
  .card .row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:6px 0;
    border-top:1px dashed var(--line);}
  .card .row span:first-child{color:var(--ink-muted);flex-shrink:0;}
  .card .row span:last-child{text-align:right;color:var(--ink);}
  .match-badge{display:inline-flex;align-items:center;gap:5px;background:var(--good-bg);color:var(--good);
    font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;margin-bottom:8px;font-family:'IBM Plex Mono',monospace;}
  .save-btn{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:9px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .save-btn svg{width:15px;height:15px;}
  .save-btn.saved{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong);}

  .footer-note{padding:8px 16px 12px;font-size:10px;color:var(--ink-faint);text-align:center;
    border-top:1px solid var(--line);flex-shrink:0;background:var(--surface);}

  /* Footer nav bar — Back / Home / Menu, always available so a wrong tap is never a dead end */
  .bottombar{display:flex;justify-content:space-around;align-items:center;flex-shrink:0;
    padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);}
  .bottombar-btn{display:flex;align-items:center;justify-content:center;background:none;border:none;
    color:var(--ink-muted);cursor:pointer;width:46px;height:40px;border-radius:12px;transition:background .15s,color .15s;}
  .bottombar-btn:hover{background:var(--surface-2);color:var(--ink);}
  .bottombar-btn:active{transform:scale(.95);}
  .bottombar-btn svg{width:21px;height:21px;}
  .bottombar-btn.disabled{opacity:.35;pointer-events:none;}

  /* Empty state (shared) */
  .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;padding:30px;text-align:center;color:var(--ink-muted);}
  .empty .oi-lg{width:52px;height:52px;border-radius:16px;background:var(--surface-2);color:var(--ink-faint);
    display:flex;align-items:center;justify-content:center;}
  .empty .oi-lg svg{width:24px;height:24px;}
  .empty p{font-size:12.5px;max-width:220px;}

  /* Saved view */
  .list-view{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px;}
  .list-header{padding:2px 2px 4px;}
  .list-header h2{font-size:18px;}
  .list-header p{font-size:11.5px;color:var(--ink-muted);margin-top:3px;}

  /* Insights view */
  .stat-row{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;padding:12px 14px;}
  .stat-row .top{display:flex;justify-content:space-between;align-items:baseline;}
  .stat-row .label{font-size:12.5px;font-weight:600;color:var(--ink);}
  .stat-row .val{font-size:12.5px;color:var(--ink-muted);}
  .sector-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
  .sector-tag{font-size:10px;font-weight:600;color:var(--ink-muted);background:var(--surface-2);
    border:1px solid var(--line);border-radius:20px;padding:3px 9px;font-family:'IBM Plex Mono',monospace;
    white-space:nowrap;}
  .sector-tag b{color:var(--ink);font-weight:600;}
  .bar-track{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden;}
  .bar-fill{height:100%;border-radius:4px;background:var(--accent);}
  .insight-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;
    display:flex;gap:12px;align-items:flex-start;}
  .insight-card .oi{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent-strong);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .insight-card .oi svg{width:17px;height:17px;}
  .insight-card p{margin:0;font-size:12px;color:var(--ink-muted);line-height:1.5;}
  .insight-card strong{color:var(--ink);}

  /* Compare view — a scoreboard read top-to-bottom by spec, left-to-right by
     plot; specs stay pinned on the left as you scroll wide comparisons. */
  /* Compare cards — stacked vertically like everywhere else in the app, so
     seeing every saved plot is one scroll down, never a scroll sideways. */
  .compare-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .compare-badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;
    padding:3px 9px;border-radius:20px;font-family:'IBM Plex Mono',monospace;}
  .compare-badge svg{width:11px;height:11px;}
  .compare-badge.price{background:var(--good-bg);color:var(--good);}
  .compare-badge.distance{background:var(--accent-soft);color:var(--accent-strong);}

  /* ---------- Drawer ---------- */
  .overlay{position:absolute;inset:0;background:rgba(8,12,22,.45);opacity:0;pointer-events:none;
    transition:opacity .2s;z-index:40;}
  .overlay.open{opacity:1;pointer-events:auto;}
  .drawer{position:absolute;top:0;right:0;bottom:0;width:76%;max-width:280px;background:var(--surface);
    transform:translateX(100%);transition:transform .25s ease;z-index:50;display:flex;flex-direction:column;
    box-shadow:-16px 0 32px -12px rgba(0,0,0,.35);}
  .drawer.open{transform:translateX(0);}
  .drawer-head{padding:22px 16px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;}
  .drawer-head h2{font-size:17px;}
  .drawer-head p{font-size:11px;color:var(--ink-muted);margin-top:3px;}
  .drawer-nav{padding:10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1;}
  .drawer-item{display:flex;align-items:center;gap:11px;padding:11px 10px;border-radius:10px;border:none;
    background:none;color:var(--ink);font-size:13.5px;font-weight:500;cursor:pointer;text-align:left;width:100%;}
  .drawer-item:hover{background:var(--surface-2);}
  .drawer-item .di{width:30px;height:30px;border-radius:9px;background:var(--surface-2);color:var(--ink-muted);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .drawer-item .di svg{width:15px;height:15px;}
  .drawer-item .badge{margin-left:auto;background:var(--accent-soft);color:var(--accent-strong);font-size:10px;
    font-weight:700;padding:2px 7px;border-radius:10px;font-family:'IBM Plex Mono',monospace;}
  .drawer-divider{height:1px;background:var(--line);margin:8px 4px;}
  .drawer-foot{padding:14px 16px 18px;font-size:10.5px;color:var(--ink-faint);border-top:1px solid var(--line);}

  /* Toast */
  .toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%) translateY(10px);
    background:var(--ink);color:var(--canvas);font-size:12px;font-weight:500;padding:9px 16px;
    border-radius:20px;opacity:0;transition:opacity .2s, transform .2s;z-index:60;pointer-events:none;
    white-space:nowrap;box-shadow:0 10px 24px -8px rgba(0,0,0,.4);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:3px;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important;transition-duration:.001ms !important;} }
</style>
<div class="phone">
  <div class="screen">
    <div class="notch"></div>
    <div class="app-shell" id="app">

      <div class="topbar">
        <div class="brand">
          <div class="mark">${'{ICON_COMPASS}'}</div>
          <div class="brand-text">
            <h1>PLOTIQ</h1>
            <p>LAND INTELLIGENCE · ISLAMABAD</p>
          </div>
        </div>
      </div>

      <div class="body-row">
        <nav class="rail" id="rail">
          <button class="rail-btn active" data-view="chat" title="Land Finder">${'{ICON_SEARCH}'}</button>
          <button class="rail-btn" data-view="saved" title="Saved Plots">${'{ICON_BOOKMARK}'}<span class="badge" id="savedBadge" style="display:none;">0</span></button>
          <button class="rail-btn" data-view="insights" title="Market Insights">${'{ICON_CHART}'}</button>
          <button class="rail-btn" data-view="compare" title="Compare Plots">${'{ICON_LAYERS}'}</button>
        </nav>

        <div class="main">

          <div class="view visible" id="view-chat">
            <div class="chat" id="chat"></div>
            <div class="footer-note">PLOTIQ Advisor · matches scored against Islamabad plot data</div>
          </div>

          <div class="view" id="view-saved"></div>
          <div class="view" id="view-insights"></div>
          <div class="view" id="view-compare"></div>

        </div>
      </div>

      <div class="bottombar" id="bottombar"></div>

      <div class="overlay" id="overlay"></div>
      <div class="drawer" id="drawer">
        <div class="drawer-head">
          <div>
            <h2>Menu</h2>
            <p>Everything PLOTIQ can do</p>
          </div>
          <button class="icon-btn" id="closeDrawer" aria-label="Close menu">${'{ICON_CLOSE}'}</button>
        </div>
        <div class="drawer-nav">
          <button class="drawer-item" data-action="new"><span class="di">${'{ICON_SEARCH}'}</span>New search</button>
          <button class="drawer-item" data-action="view-saved"><span class="di">${'{ICON_BOOKMARK}'}</span>Saved plots<span class="badge" id="drawerSavedBadge" style="display:none;">0</span></button>
          <button class="drawer-item" data-action="view-insights"><span class="di">${'{ICON_CHART}'}</span>Market insights</button>
          <button class="drawer-item" data-action="view-compare"><span class="di">${'{ICON_LAYERS}'}</span>Compare plots</button>
          <div class="drawer-divider"></div>
          <button class="drawer-item" data-action="house"><span class="di">${'{ICON_HOUSE}'}</span>Find land for a house</button>
          <button class="drawer-item" data-action="factory"><span class="di">${'{ICON_FACTORY}'}</span>Find land for a factory</button>
          <button class="drawer-item" data-action="shop"><span class="di">${'{ICON_SHOP}'}</span>Find land for a shop</button>
          <button class="drawer-item" data-action="farmhouse"><span class="di">${'{ICON_TREE}'}</span>Find land for a farmhouse</button>
        </div>
        <div class="drawer-foot">PLOTIQ Prototype · rule-based demo logic</div>
      </div>

      <div class="toast" id="toast"></div>
    </div>
  </div>
</div>

<script>
// ================= Icons =================
const ICONS = {
  compass:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15 9l-2.2 6-3.8 1.5L11 10z" fill="currentColor" stroke="none"/></svg>',

  arrowLeft:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/><path d="M8 12h9"/></svg>',

  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3"/></svg>',

  layers:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5-8 4.5-8-4.5z"/><path d="M4 12l8 4.5 8-4.5"/><path d="M4 16.5L12 21l8-4.5"/></svg>',
  house:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5L12 4l8 7.5"/><path d="M6 10v9h12v-9"/><path d="M10 19v-5h4v5"/></svg>',
  coins:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="14" height="9" rx="2"/><path d="M8 8V6a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-2"/><path d="M9 12.5h4"/></svg>',
  shop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9l1.2-4.5h13.6L20 9"/><path d="M4 9a2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0"/><path d="M5.5 9V19h13V9"/><path d="M10 19v-5h4v5"/></svg>',
  factory:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V12l4.5 3V12L13 15V9l7-3v14z"/><path d="M4 20h16"/><path d="M17 6V3"/></svg>',
  tree:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l4 6h-2.5l3.5 5.5h-3L17 19H7l3-4.5H7L10.5 9H8z"/><path d="M12 19v2"/></svg>',

function icon(name){ return ICONS[name] || ''; }
function barsIcon(level, max){ // magnitude icon: filled bars out of max
  const w=3.4, gap=2.2, h0=6; let bars='';
  for(let i=0;i<max;i++){
    const bh = h0 + i*3.6;
    const x = 2 + i*(w+gap);
    const y = 20 - bh;
    const on = i < level;
    bars += `<rect x="${x}" y="${y}" width="${w}" height="${bh}" rx="1" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="1.3"/>`;
  }
  return `<svg viewBox="0 0 24 24">${bars}</svg>`;
}

function scorePlot(plot){
  if(plot.type !== answers.purpose.value) return null;
  let score = 0;
  const reasons = [];

  const minSize = Math.min(...plot.sizes);
  const minCost = minSize * plot.pricePerMarlaLac;
  if(minCost > answers.budget.value * 1.2) return null;
  score += Math.max(0, 28 - Math.abs(minCost - answers.budget.value) / 12);

  const [lo, hi] = answers.scale.range;
  const mid = (lo+hi)/2;
  const bestSize = plot.sizes.find(s => s >= lo && s <= hi) || plot.sizes.reduce((a,b)=>Math.abs(b-mid)<Math.abs(a-mid)?b:a);
  const sizeDelta = Math.min(...plot.sizes.map(s=>Math.abs(s-mid)));
  score += Math.max(0, 27 - sizeDelta/2);
  if(plot.sizes.some(s=>s>=lo && s<=hi)) reasons.push(`has ${bestSize}-Marla plots in your scale`);

  if(plot.vibe.includes(answers.vibe.tag)){
    score += 25;
    reasons.push(`matches "${answers.vibe.label}"`);
  }

  if(answers.purpose.tag === 'investment' && plot.vibe.includes('affordable')){ score += 10; reasons.push('developing area, strong resale upside'); }
  if(answers.purpose.tag === 'business' && plot.vibe.includes('high-traffic')){ score += 10; reasons.push('high footfall for business'); }
  if(answers.purpose.tag === 'weekend' && plot.vibe.includes('scenic')){ score += 10; reasons.push('scenic weekend setting'); }
  if(answers.purpose.tag === 'production' && plot.vibe.includes('logistics')){ score += 10; reasons.push('strong logistics access'); }

  score += 10;
  return {plot, score, bestSize, reasons};
}

function matchCardHTML(r, opts){
  opts = opts || {};

  return `
    <div class="card" data-plot="${r.plot.id}" data-size="${r.bestSize}">
      <button class="save-btn ${saved?'saved':''}" data-save="${r.plot.id}" aria-label="Save plot">${saved?icon('bookmarkFill'):icon('bookmark')}</button>
      ${opts.badge!==false ? `<span class="match-badge">${opts.badgeLabel || 'Match'} · ${Math.min(99, Math.round(r.score))}% fit</span>` : ''}
      <h3>${r.plot.sector}</h3>
      <div class="meta">${TYPE_LABEL[r.plot.type]} · ${r.plot.distance}</div>
      <div class="row"><span>Recommended size</span><span>${r.bestSize} Marla</span></div>
      <div class="row"><span>Est. price</span><span class="mono">~${r.plot.pricePerMarlaLac} lac/Marla (${totalCostLac} lac total)</span></div>
      ${r.reasons && r.reasons.length ? `<div class="row"><span>Why</span><span>${r.reasons.join('; ')}</span></div>` : ''}
    </div>`;
}

// The in-memory array is the source of truth for this running session — the
// Saved view always reflects it immediately. localStorage is a best-effort
// extra so the list also survives a reload; when a browser/embed context
// blocks it (private tabs, a sandboxed preview), saving still works correctly
// within the session, it just won't survive a full page reload.
function loadSaved(){ try{ return JSON.parse(localStorage.getItem('plotiq_saved_v1')) || []; }catch(e){ return []; } }
function persistSaved(){ try{ localStorage.setItem('plotiq_saved_v1', JSON.stringify(savedPlots)); }catch(e){ /* best effort only */ } }
let savedPlots = loadSaved();
function isSaved(plotId){ return savedPlots.some(s=>s.plotId===plotId); }
function toggleSave(plotId, size){
  const idx = savedPlots.findIndex(s=>s.plotId===plotId);
  if(idx>-1){ savedPlots.splice(idx,1); persistSaved(); refreshSavedUI(); showToast('Removed from saved'); return false; }
  savedPlots.push({plotId, size, savedAt:Date.now()});
  persistSaved();
  refreshSavedUI();
  showToast('Saved to your list');
  return true;
}
function refreshSavedUI(){
  const count = savedPlots.length;
  [document.getElementById('savedBadge'), document.getElementById('drawerSavedBadge')].forEach(b=>{
    if(!b) return;
    b.textContent = count;
    b.style.display = count>0 ? 'flex' : 'none';
  });
  document.querySelectorAll('.save-btn').forEach(btn=>{
    const id = Number(btn.dataset.save);
    const on = isSaved(id);
    btn.classList.toggle('saved', on);
    btn.innerHTML = on ? icon('bookmarkFill') : icon('bookmark');
  });
  if(currentView==='saved') renderSavedView();
}

  let html = `<div class="list-view"><div class="list-header"><h2>Saved plots</h2><p>${list.length} plot${list.length>1?'s':''} bookmarked on this device</p></div>`;
  list.slice().reverse().forEach(s=>{

  const maxAvg = Math.max(...stats.map(s=>s.avg));

    el.innerHTML = `<div class="empty">
      <div class="oi-lg">${icon('layers')}</div>
      <h3 style="font-size:15px;">Save 2+ plots to compare</h3>
      <p>${rows.length===0 ? "You haven't saved any plots yet." : "You've saved 1 — save at least one more."} Bookmark plots from the Land Finder, then come back here.</p>
    </div>`;
    return;
  }

  // annotate each saved plot with its total price and travel time, so the
  // cheapest and closest can be flagged without any side-scrolling table
  const parseMinutes = distance => { const m = distance.match(/(\d+)/); return m ? parseInt(m[1],10) : 999; };
  const withStats = rows.map(r => ({
    ...r,
    total: r.s.size * r.plot.pricePerMarlaLac,
    minutes: parseMinutes(r.plot.distance),
  })).sort((a,b) => a.total - b.total); // cheapest first — the most useful read order

  const cheapestTotal = Math.min(...withStats.map(r=>r.total));
  const closestMinutes = Math.min(...withStats.map(r=>r.minutes));

  let html = `<div class="list-view">
    <div class="list-header"><h2>Compare plots</h2><p>${rows.length} saved plots, cheapest first</p></div>`;

  withStats.forEach(r => {
    const badges = [];
    if(r.total === cheapestTotal) badges.push(`<span class="compare-badge price">${icon('tag')} Best price</span>`);
    if(r.minutes === closestMinutes) badges.push(`<span class="compare-badge distance">${icon('mapPin')} Closest</span>`);
    html += `
    <div class="card">
      <button class="save-btn saved" data-save="${r.plot.id}" data-size="${r.s.size}" aria-label="Remove from compare">${icon('bookmarkFill')}</button>
      ${badges.length ? `<div class="compare-badges">${badges.join('')}</div>` : ''}
      <h3>${r.plot.sector}</h3>
      <div class="meta">${TYPE_LABEL[r.plot.type]} · ${r.plot.distance}</div>
      <div class="row"><span>Size</span><span class="mono">${r.s.size} Marla</span></div>
      <div class="row"><span>Price/Marla</span><span class="mono">${r.plot.pricePerMarlaLac}L</span></div>
      <div class="row"><span>Total price</span><span class="mono">${r.total}L</span></div>
    </div>`;
  });

  html += `</div>`;
  el.innerHTML = html;
}

// ================= View / nav wiring =================
let currentView = 'chat';
let viewHistory = []; // stack of views visited, so a stray tap is always recoverable

function setView(v, opts){
  opts = opts || {};
  if(!opts.skipHistory && v !== currentView){ viewHistory.push(currentView); }
  currentView = v;
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('visible'));
  document.getElementById('view-'+v).classList.add('visible');
  document.querySelectorAll('.rail-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
  if(v==='saved') renderSavedView();
  if(v==='insights') renderInsightsView();
  if(v==='compare') renderCompareView();
  // Chat (the Land Finder) is "home" — arriving there by any route (rail tap,
  // Back, Home) clears the back-stack, so Back can never bounce you into a
  // view you already deliberately left once you're back at your work.
  if(v === 'chat'){ viewHistory = []; }
  closeDrawer();
  updateBottombar();
}

function goBack(){
  // Inside the Land Finder, Back first undoes the last answered question
  // (returning you to it, still pickable) before it ever leaves the chat.
  if(currentView === 'chat' && chatCheckpoints.length > 0){
    const cp = chatCheckpoints.pop();
    while(chatEl.children.length > cp.childCount){ chatEl.removeChild(chatEl.lastElementChild); }
    delete answers[cp.clearKey];
    STEP_SHOW_FN[cp.clearKey]();
    updateBottombar();
    return;
  }
  if(viewHistory.length===0){ showToast("You're already at the start"); return; }
  const prev = viewHistory.pop();
  setView(prev, {skipHistory:true});
}
function goHome(){
  viewHistory = [];
  setView('chat', {skipHistory:true});
}
function updateBottombar(){
  const backBtn = document.getElementById('btnBack');
  if(!backBtn) return;
  const nothingToUndo = currentView === 'chat' ? chatCheckpoints.length===0 : viewHistory.length===0;
  backBtn.classList.toggle('disabled', nothingToUndo);
}

document.getElementById('rail').addEventListener('click', (e)=>{
  const btn = e.target.closest('.rail-btn');
  if(btn) setView(btn.dataset.view);
});

const bottombarEl = document.getElementById('bottombar');
bottombarEl.innerHTML = `
  <button class="bottombar-btn disabled" id="btnBack" aria-label="Back">${icon('arrowLeft')}</button>
  <button class="bottombar-btn" id="btnHome" aria-label="Home">${icon('house')}</button>
  <button class="bottombar-btn" id="btnMenu" aria-label="Menu">${icon('menu')}</button>
`;
document.getElementById('btnBack').onclick = goBack;
document.getElementById('btnHome').onclick = goHome;
document.getElementById('btnMenu').onclick = openDrawer;

document.getElementById('chat').addEventListener('click', (e)=>{
  const saveBtn = e.target.closest('.save-btn');
  if(saveBtn){ toggleSave(Number(saveBtn.dataset.save), Number(saveBtn.closest('.card').dataset.size)); }
});
document.getElementById('view-saved').addEventListener('click', (e)=>{
  const saveBtn = e.target.closest('.save-btn');
  if(saveBtn){ toggleSave(Number(saveBtn.dataset.save), Number(saveBtn.closest('.card').dataset.size)); }
});
document.getElementById('view-compare').addEventListener('click', (e)=>{
  const saveBtn = e.target.closest('.save-btn');
  if(saveBtn){ toggleSave(Number(saveBtn.dataset.save), Number(saveBtn.dataset.size)); renderCompareView(); }
});

const drawerEl = document.getElementById('drawer');
const overlayEl = document.getElementById('overlay');
function openDrawer(){ drawerEl.classList.add('open'); overlayEl.classList.add('open'); }
function closeDrawer(){ drawerEl.classList.remove('open'); overlayEl.classList.remove('open'); }
document.getElementById('closeDrawer').onclick = closeDrawer;
overlayEl.onclick = closeDrawer;

document.querySelectorAll('.drawer-item').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const action = btn.dataset.action;
    if(action==='new'){ setView('chat'); startChat(); return; }
    if(action==='view-saved'){ setView('saved'); return; }
    if(action==='view-insights'){ setView('insights'); return; }
    if(action==='view-compare'){ setView('compare'); return; }
    // quick-start by purpose type
    const map = {house:'residential', factory:'industrial', shop:'commercial', farmhouse:'farmhouse'};
    const target = map[action];
    if(target){
      setView('chat');
      chatEl.innerHTML = ''; answers = {};
      viewHistory = []; chatCheckpoints = []; stepMark = {purpose: 0}; updateBottombar();
      addBubble(STEP1.bot, 'bot');
      const opt = STEP1.options.find(o=>o.value===target && (action!=='house' || o.tag==='family'));
      setTimeout(()=>{ addBubble(opt.label, 'user'); onPurpose(opt); }, 150);
    }
  });
});

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> t.classList.remove('show'), 1800);
}

// ================= Init =================
refreshSavedUI();
startChat();
</script>
